<title>ShopScope · Etsy market research</title>
<style>
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--bg:#f4f4ef;--card:#fff;--tx:#1a1d1b;--mu:#667069;--bd:#e2e1d8;--soft:#ecebe2;--ac:#15803d;--ac2:#15803d14;--onac:#fff;--side:#0d4a32;--sidetx:#cfe6da;
 --g:#16a34a;--y:#c99a06;--o:#e0791a;--r:#9b1c1c;--ease:cubic-bezier(.23,1,.32,1)}

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:14.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.brand{display:flex;gap:10px;align-items:center;margin:2px 10px 18px;color:#fff;font-weight:700;font-size:1.15rem}
.brand i{width:26px;height:26px;border-radius:8px;background:#34d399;display:grid;place-items:center;color:#06281c}

.sub{display:none;padding:2px 0 6px}.grp.open .sub{display:block}
.sub a{display:flex;justify-content:space-between;gap:6px;padding:7px 12px 7px 41px;border-radius:8px;color:var(--sidetx);text-decoration:none;font-size:.9rem;opacity:.92}

.sub a[aria-current=page],aside a.nv[aria-current=page]{background:rgba(255,255,255,.14);color:#fff;opacity:1}
.foot-side{margin-top:auto;padding:12px 10px 2px;font-size:.74rem;opacity:.7}
@media(hover:hover){aside .nv:hover,.sub a:hover{background:rgba(255,255,255,.09);color:#fff}}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px clamp(14px,3vw,36px);background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top form{display:flex;flex:1;min-width:230px;max-width:520px;gap:8px}.top input{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--mu);padding:0 12px;min-height:38px;font:inherit;font-weight:650;cursor:pointer}.seg button[aria-pressed=true]{background:var(--ac);color:var(--onac)}
.top select{max-width:190px}
.btn.burger{display:inline-flex}
main{padding:26px clamp(14px,3vw,36px) 20px;max-width:1400px;width:100%}
h1{margin:0;font-size:1.55rem;letter-spacing:-.02em;font-weight:680}.sub-h{margin:4px 0 20px;color:var(--mu);max-width:72ch}
h2{margin:26px 0 10px;font-size:1.05rem}h4{margin:0 0 6px}
.mu{color:var(--mu)}.err{color:#b42318;font-weight:600}
input,select,textarea,.btn{font:inherit}
input,select,textarea{min-height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);transition:border-color .15s,box-shadow .15s}

input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-weight:600;transition:transform .15s var(--ease),filter .15s,border-color .15s}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}.btn.sm{min-height:32px;padding:0 11px;font-size:.84rem}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:active{transform:scale(.97)}@media(hover:hover){.btn:hover:not(:disabled){border-color:var(--ac)}.btn.p:hover:not(:disabled){filter:brightness(1.08)}}
.panel{background:var(--soft);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.panel form,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panel input[type=text]{flex:1;min-width:200px}
.panel label{font-size:.82rem;color:var(--mu);display:block;margin-bottom:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px}.card h3{margin:0 0 10px;font-size:.95rem}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

.kpi small{display:block;color:var(--mu);font-size:.78rem;font-weight:550}.kpi b{display:block;font-size:1.5rem;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}.kpi i{font-style:normal;color:var(--mu);font-size:.76rem}
.empty{border:1px dashed var(--bd);border-radius:14px;padding:38px 20px;text-align:center;color:var(--mu);background:var(--card)}
.note{border-left:3px solid var(--y);background:var(--card);border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 16px;font-size:.88rem;color:var(--mu)}
.tbar{display:flex;gap:10px;align-items:center;margin:0 0 8px;flex-wrap:wrap}.tbar input{width:240px;min-height:34px}.cnt{font-size:.82rem;margin-right:auto}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card);max-height:640px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle;font-size:.86rem}
th{position:sticky;top:0;background:var(--soft);color:var(--mu);font-weight:600;font-size:.78rem;white-space:nowrap;user-select:none;z-index:1}
th[data-k]{cursor:pointer;user-select:none;white-space:nowrap}th[data-k]:hover{color:var(--tx)}th[data-k]:not(.on):hover::after{content:" ⇅";opacity:.45}th.on{color:var(--tx)}
tbody tr:last-child td{border-bottom:0}td.n,th.n{text-align:right}
td a,.lnk{color:var(--ac);font-weight:600;text-decoration:none}td a:hover{text-decoration:underline}
.tt{min-width:260px;max-width:420px}.tt a{color:var(--tx);font-weight:600}.mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.mini span{font-size:.72rem;background:var(--soft);border-radius:5px;padding:1px 6px;color:var(--mu)}
.thumb{border:0;padding:0;background:none;cursor:zoom-in;border-radius:8px;overflow:hidden;display:block;width:72px;height:58px}.thumb img{width:72px;height:58px;object-fit:cover;display:block}
.thumb.noimg{background:var(--soft);cursor:default}
.pl{display:inline-block;min-width:74px;text-align:center;padding:3px 10px;border-radius:7px;font-weight:650;font-size:.82rem;color:#fff;background:#8a928d}
.pl.g{background:var(--g)}.pl.y{background:var(--y)}.pl.o{background:var(--o)}.pl.r{background:var(--r)}.pl.s{min-width:34px;padding:3px 8px}
.mb{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--bd);vertical-align:middle;margin-right:6px;overflow:hidden}.mb i{display:block;height:100%;background:var(--ac)}
.star{border:0;background:none;color:var(--mu);cursor:pointer;width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center}
.ok{color:var(--g);font-weight:700}.bad{color:var(--r);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:18px 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:600;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tabs button[aria-selected=true]{color:var(--ac);border-color:var(--ac)}.tabs button:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 11px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:.84rem;color:var(--tx);text-decoration:none}.chip.ok{border-color:var(--g)}.chip.bad{border-color:var(--r)}.chip.s{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
button.chip{cursor:pointer;font:inherit;font-size:.84rem}
.ring{position:relative;width:110px;height:110px;flex:none}.ring svg{width:110px;height:110px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:1.5rem;line-height:1}.ring small{font-size:.66rem;color:var(--mu);font-weight:500;margin-top:3px}
.pb{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:3px 0 11px}.pb div{height:100%;background:var(--ac);border-radius:4px;animation:grow .6s var(--ease) both;transform-origin:left}
.bar{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:.85rem}.bar span:first-child{width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar div{height:10px;background:var(--ac);border-radius:5px;animation:grow .5s var(--ease) both;transform-origin:left}
.sk{height:16px;border-radius:6px;margin:14px 0;background:linear-gradient(90deg,var(--bd) 30%,var(--ac2) 50%,var(--bd) 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
.lay{display:grid;grid-template-columns:230px 1fr;gap:16px}.lists a{display:flex;justify-content:space-between;padding:9px 12px;border-radius:9px;color:var(--tx);text-decoration:none;font-weight:550;cursor:pointer}.lists a[aria-current=true]{background:var(--ac2);color:var(--ac)}
.letter{font-size:2.6rem;font-weight:800}.feed{display:grid;gap:12px}.feed .chips{gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lc{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}.lc img{width:100%;height:140px;object-fit:cover;display:block;background:var(--soft)}.lc div{padding:10px 12px;font-size:.82rem}.lc b{display:block;font-size:.84rem;line-height:1.3;margin-bottom:4px;max-height:2.7em;overflow:hidden}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:20px;width:min(420px,92vw)}dialog.big{width:min(760px,94vw)}dialog::backdrop{background:#0007}dialog h3{margin:0 0 10px}dialog label{display:block;margin:10px 0;font-size:.85rem;color:var(--mu)}dialog select,dialog input{width:100%;margin-top:4px}
.det{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:18px}.det img{width:100%;border-radius:10px;display:block;background:var(--soft)}
.av{position:relative;width:36px;height:36px;border-radius:50%;background:var(--ac2);color:var(--ac);font-weight:700;font-size:.9rem;display:inline-grid;place-items:center;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.av.lg{width:56px;height:56px;font-size:1.25rem}
.rk{display:grid;gap:10px}.rk .it{display:grid;grid-template-columns:20px 36px minmax(0,1fr) auto;gap:10px;align-items:center;animation:in .3s var(--ease) both}
.rk .nm{display:block;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.rk .tr{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:5px}.rk .tr i{display:block;height:100%;background:var(--ac);border-radius:4px;animation:grow .55s var(--ease) both;transform-origin:left}
.rk .pos{color:var(--mu);font-size:.8rem;font-variant-numeric:tabular-nums;text-align:right}.rk .val{text-align:right;font-variant-numeric:tabular-nums}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.legend{display:grid;gap:6px;font-size:.85rem;min-width:150px}.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.cardhead{display:flex;align-items:center;gap:10px;margin:0 0 12px}.cardhead h3{margin:0;margin-right:auto}.cardhead a{font-size:.84rem;font-weight:600;color:var(--ac);text-decoration:none}
.lc{transition:transform .2s var(--ease),border-color .15s}.lc:active{transform:scale(.98)}
.lc .mt{padding:0;height:5px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.lc .mt i{display:block;height:100%;background:var(--ac);border-radius:3px;transform-origin:left;animation:grow .55s var(--ease) both}
.est{display:inline-block;font-size:.72rem;font-weight:650;border:1px solid var(--y);color:var(--y);border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:middle}
.ctybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ctybar select{min-width:210px}
@media(hover:hover){.lc:hover{border-color:var(--ac)}}
.chat{display:grid;gap:12px;max-width:860px}.msg{padding:12px 16px;border-radius:14px;max-width:92%;line-height:1.55;animation:in .25s var(--ease) both}
.msg.u{background:var(--ac);color:var(--onac);justify-self:end;border-bottom-right-radius:4px}.msg.a{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.msg.a h4{margin:10px 0 4px}.msg.a ul{margin:6px 0;padding-left:20px}.msg .src{margin-top:8px;font-size:.76rem;color:var(--mu)}
.composer{display:flex;gap:10px;align-items:flex-end;margin-top:14px;max-width:860px}.composer textarea{min-height:48px;max-height:160px}

@keyframes in{from{opacity:0;transform:translateY(8px)}}@keyframes grow{from{transform:scaleX(0)}}@keyframes sh{to{background-position:-300% 0}}
#view>*{animation:in .3s var(--ease) both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:900px){aside{position:fixed;z-index:20;left:0;transform:translateX(-100%);transition:transform .25s var(--ease);width:270px}aside.open{transform:none}.btn.burger{display:inline-flex}.lay,.det{grid-template-columns:1fr}}

/* ---- Category Report v2 ---- */
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;font-size:.9rem;color:var(--mu)}.crumb a{color:var(--ac);text-decoration:none;font-weight:600}.crumb a:hover{text-decoration:underline}.crumb b{color:var(--tx);font-weight:650}
.ctabs{display:flex;gap:6px;margin:0 0 16px}.ctabs a{padding:7px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--mu);text-decoration:none;font-weight:600;font-size:.88rem}.ctabs a[aria-current=page]{border-color:var(--ac);color:var(--ac);background:var(--ac2)}
.catbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 16px}.catbar input{flex:1;min-width:220px;max-width:460px}.catbar .mu{font-size:.84rem}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.catcard{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;min-height:76px;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s;animation:rise .35s var(--ease) both;animation-delay:calc(var(--i,0)*18ms)}
.catcard:active{transform:scale(.98)}@media(hover:hover){.catcard:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(0,0,0,.06);transform:translateY(-1px)}}
.catcard .mn{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:.92rem;letter-spacing:.02em;background:var(--ac2);color:var(--ac)}
.catcard b{display:block;font-size:.94rem;line-height:1.25}.catcard small{display:block;color:var(--mu);font-size:.78rem;margin-top:2px}
.catcard .go{margin-left:auto;color:var(--mu);flex:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.catcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.catcols>div{display:grid;gap:14px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px}.ch h3{margin:0}.ch small{color:var(--mu);font-size:.76rem}
.cnote{margin:0 0 8px;color:var(--mu);font-size:.8rem}
.rl{display:grid;gap:2px}.rw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) 58px;gap:10px;align-items:center;padding:6px 6px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:.88rem}
a.rw:hover{background:var(--soft)}.rw .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rw .tr{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.rw .tr i{display:block;height:100%;border-radius:4px;background:var(--c1);transform-origin:left;animation:grow .55s var(--ease) both}
.rw .v{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--mu);min-width:48px;text-align:right}
.vol{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--ac2);color:var(--ac);font-weight:650;font-size:.78rem;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.shr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;color:var(--tx);text-decoration:none}a.shr:hover{background:var(--soft)}
.shr b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shr small{color:var(--mu);font-size:.78rem}.shr .tr{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}.shr .tr i{display:block;height:100%;background:var(--c1);border-radius:3px;animation:grow .55s var(--ease) both;transform-origin:left}
@media(max-width:1100px){.catgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.catcols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.catgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:340px){.catgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:420px){.rw{grid-template-columns:minmax(0,1fr) 58px}.rw .tr{display:none}}
@media(prefers-reduced-motion:reduce){.catcard,.rw .tr i,.shr .tr i{animation:none}.catcard{transition:none}}
/* ---- Coach IA v2 ---- */
.cc{display:grid;grid-template-columns:272px minmax(0,1fr);gap:16px;align-items:start}.cc.closed{grid-template-columns:minmax(0,1fr)}.cc.closed .cc-side{display:none}

.cc-list{flex:1;overflow:auto;padding:4px 6px;display:grid;grid-template-columns:minmax(0,1fr);gap:2px;align-content:start}

.cc-it .ib{border:0;background:none;color:var(--mu);width:30px;height:30px;display:grid;place-items:center;border-radius:7px;cursor:pointer;opacity:0;transition:opacity .15s,color .15s}.cc-it .ib svg{width:15px;height:15px}
.cc-it.on{background:var(--ac2)}.cc-it.on .t{font-weight:650;color:var(--ac)}.cc-it.on .ib,.cc-it:focus-within .ib{opacity:1}
@media(hover:hover){.cc-it:hover{background:var(--soft)}.cc-it:hover .ib{opacity:1}.cc-it .ib:hover{color:var(--tx)}}
@media(hover:none){.cc-it .ib{opacity:1}}

async function api(path,opt){
  const sep=path.includes("?")?"&":"?",url=path+sep+"lang="+LANG+(CTY?"&country="+CTY:"");

  finally{NP.end()}
}

async function catDetail(host,[name,es]){
  host.innerHTML=head("Etsy Category Report",L("Informe de la categoría seleccionada.","Report for the selected category."))+
   `<nav class="crumb" aria-label="Breadcrumb"><a href="#/categories">Etsy Category Report</a><span aria-hidden="true">/</span><b>${esc(name)}</b></nav><div style="margin:-4px 0 16px"><a class="btn sm" href="#/categories" style="text-decoration:none">‹ ${L("Volver a categorías","Back to categories")}</a></div><div id="cd">${skel()}</div>`;
  const out=$("#cd");
  try{
    const d=await api("/api/category?name="+encodeURIComponent(name)),cur=d.currency;
    const mx=a=>Math.max(...a,1);
    const subs=d.subs.length?rowBars(d.subs.map(r=>({name:r.name,w:r.share/mx(d.subs.map(x=>x.share))*100,right:`<span class="vol" title="${esc(L("% de la muestra","% of sample"))}">${r.share}%</span>`}))):`<p class="mu">${L("Sin subcategorías en la muestra.","No sub-categories in the sample.")}</p>`;
    const kwU=rowBars(d.kw_used.map(k=>({name:k.tag,href:"#/kw?q="+encodeURIComponent(k.tag),w:k.use_pct/mx(d.kw_used.map(x=>x.use_pct))*100,right:`<span class="vol" title="${esc(L("% de anuncios top que usan la etiqueta","% of top listings using the tag"))}">${k.use_pct}%</span>`})));
    const kwF=rowBars(d.kw_fav.map(k=>({name:k.tag,href:"#/kw?q="+encodeURIComponent(k.tag),w:k.fav_pct/mx(d.kw_fav.map(x=>x.fav_pct))*100,right:k.fav_pct+"%"})));
    const shMx=mx(d.shops.map(x=>x.fav_pct));
    const shops=d.shops.length?d.shops.map(s=>`<a class="shr" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${av(s)}<span><b>${esc(s.name)}</b><small>${nf(s.sold)} ${L("ventas","sales")} · ${s.rating?Number(s.rating).toFixed(1)+" ★ · ":""}${s.in_top} ${L("anuncios en la muestra","listings in sample")}</small><span class="tr" aria-hidden="true"><i style="width:${Math.max(3,s.fav_pct/shMx*100)}%"></i></span></span><span class="v mu" style="font-size:.8rem">${s.fav_pct}%</span></a>`).join(""):`<p class="mu">—</p>`;
    out.innerHTML=`<div class="kpis">${kpi(L("Anuncios activos en Etsy","Active Etsy listings"),nf(d.total))}${kpi(L("Muestra analizada","Sample analyzed"),nf(d.sample),L("los mejor posicionados","top-ranked"))}${kpi(L("Precio medio","Avg price"),money(d.avg_price,cur),d.price?L("rango típico ","typical range ")+money(d.price.p25)+" – "+money(d.price.p75):"")}${kpi(L("Favoritos medios","Avg favorites"),nf(d.avg_fav),nf(d.fresh)+L(" anuncios nuevos analizados"," new listings analyzed"))}</div>
    <p class="cnote">${L("Etsy no publica volumen de búsquedas ni clics. Las etiquetas verdes muestran el % de anuncios top que usan cada elemento y las barras azules el % de favoritos (interés real del comprador) de la muestra.","Etsy does not publish search volume or clicks. Green labels show the % of top listings using each item and blue bars the % of favorites (real buyer interest) in the sample.")}</p>
    <div class="catcols"><div>
      <section class="card"><div class="ch"><h3>Top Subcategories</h3><small>${L("% de la muestra","% of sample")}</small></div>${subs}</section>
      <section class="card"><div class="ch"><h3>Top Keywords</h3><small>${L("más usadas en anuncios top","most used in top listings")}</small></div>${kwU}</section>
      <section class="card"><div class="ch"><h3>Location Breakdown</h3><small>${L("anuncios por país del vendedor (33 países)","listings by seller country (33 countries)")}</small></div><div id="geo">${skel()}</div></section>
    </div><div>
      <section class="card"><div class="ch"><h3>Top Shops</h3><small>${L("ordenadas por ventas totales","ranked by total sales")}</small></div>${shops}</section>
      <section class="card"><div class="ch"><h3>Top Keywords by Favorites</h3><small>${L("% de favoritos de la muestra","% of sample favorites")}</small></div>${kwF}</section>
      ${d.rising.length?`<section class="card"><div class="ch"><h3>${L("Palabras en alza","Rising keywords")}</h3><small>${L("anuncios más nuevos · fav/día","newest listings · fav/day")}</small></div>${bars(d.rising.map(r=>({l:r.tag,v:r.favday,href:"#/kw?q="+encodeURIComponent(r.tag),sub:r.n+" "+L("anuncios nuevos la usan","new listings use it")})),{rank:false})}</section>`:""}
      ${d.web&&d.web.length?`<section class="card"><div class="ch"><h3>${L("Tendencias en la web","Trends on the web")}</h3><small>${L("fuentes externas","external sources")}</small></div><div class="webl">${d.web.map(w=>`<a href="${esc(safeUrl(w.url))}" target="_blank" rel="noopener"><b>${esc(w.title)}</b><span>${esc(w.snippet)}</span></a>`).join("")}</div></section>`:""}
    </div></div>`;
    api("/api/category/geo?name="+encodeURIComponent(name)).then(g=>{const el=$("#geo");if(!el)return;
      if(!g.filter_ok){el.innerHTML=`<p class="mu">${L("Etsy no aplicó el filtro por país en esta categoría; no hay desglose fiable.","Etsy did not apply the country filter for this category; no reliable breakdown.")}</p>`;return}
      const m=mx(g.rows.map(r=>r.share));
      el.innerHTML=rowBars(g.rows.map(r=>({name:cname(r.code),w:r.share/m*100,right:`<span class="vol">${r.share}%</span>`})))+`<p class="cnote" style="margin-top:8px">${L("Sobre los","Out of")} ${nf(g.total)} ${L("anuncios activos de la categoría; se muestran los 15 países con más anuncios de "+g.countries+" consultados.","active listings in the category; the 15 countries with the most listings out of "+g.countries+" queried.")}</p>`;
    }).catch(e=>{const el=$("#geo");el&&fail(el,e)});
  }catch(e){fail(out,e)}
}

   <div class="panel"><form id="f" style="align-items:stretch;flex-direction:column"><div class="row"><input type="text" id="q" placeholder="${L("Palabra clave principal, p. ej. handmade silver ring","Main keyword, e.g. handmade silver ring")}" aria-label="${L("Palabra clave principal","Main keyword")}" style="flex:1"><select id="ol" aria-label="${L("Idioma del anuncio","Listing language")}"><option value="en">${L("Anuncio en inglés","Listing in English")}</option><option value="es">${L("Anuncio en español","Listing in Spanish")}</option></select></div>
   <textarea id="nt" placeholder="${L("Datos reales de tu producto: material, medidas, colores, personalización, público…","Real facts about your product: material, size, colors, personalization, audience…")}" aria-label="${L("Notas","Notes")}"></textarea>
   <div class="row"><button class="btn p" data-m="ai" ${CFG.ai?"":"disabled"}>${L("Generar con IA","Generate with AI")}</button><button class="btn" data-m="rules">${L("Generar con reglas","Generate with rules")}</button></div></form></div><div id="out"><div class="empty">${L("Escribe la palabra clave principal de tu producto.","Type the main keyword of your product.")}</div></div>`;
  const show=(o,src)=>{const out=$("#out"),box=(t,id,v,h)=>`<div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0;margin-right:auto">${t}</h3><span class="mu" id="${id}c"></span><button class="btn sm" data-cp="${id}">${L("Copiar","Copy")}</button></div><textarea id="${id}" style="min-height:${h}px">${esc(v)}</textarea></div>`;
    out.innerHTML=`<p class="mu">${src==="ai"?L("Generado con IA","Generated with AI"):L("Generado por reglas","Generated with rules")}</p><div class="grid">${box(L("Título","Title"),"ht",o.title,70)}${box(L("Etiquetas (13 máx., 20 caracteres)","Tags (13 max, 20 characters)"),"hg",o.tags.join(", "),70)}${box(L("Descripción","Description"),"hd",o.description,260)}</div>`;
    const cnt=()=>{$("#htc").textContent=$("#ht").value.length+"/140";$("#hgc").textContent=$("#hg").value.split(",").filter(x=>x.trim()).length+"/13";$("#hdc").textContent=$("#hd").value.split(/\s+/).filter(Boolean).length+" "+L("palabras","words")};
    $$("textarea",out).forEach(t=>t.oninput=cnt);cnt();$$("[data-cp]",out).forEach(b=>b.onclick=()=>copy($("#"+b.dataset.cp).value))};
  const rules=async(q,ol)=>{const d=await api("/api/search?n=200&q="+encodeURIComponent(q)),stop=new Set("a an and the for of with to in on or your you my de la el y para con".split());
    const ng=n=>{const c={};d.items.forEach(x=>{const t=x.title.toLowerCase().match(/[a-z0-9']+/g)||[];for(let i=0;i<=t.length-n;i++){const g=t.slice(i,i+n);if(stop.has(g[0])||stop.has(g[n-1]))continue;c[g.join(" ")]=(c[g.join(" ")]||0)+1}});return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0])};
    let title=q.replace(/\b\w/g,c=>c.toUpperCase());const used=new Set(q.toLowerCase().split(/\s+/));
    for(const g of [...ng(3),...ng(2)]){if(g.split(" ").every(w=>used.has(w)))continue;const add=", "+g.replace(/\b\w/g,c=>c.toUpperCase());if((title+add).length>138)break;title+=add;g.split(" ").forEach(w=>used.add(w))}
    const cand=d.tags.filter(t=>t.words>=2&&t.uso>=2).sort((a,b)=>(b.uso*2+b.opp)-(a.uso*2+a.opp)).map(t=>t.tag).filter(t=>t.length<=20);
    const es=ol==="es";return{title,tags:[...new Set([q.toLowerCase().slice(0,20),...cand])].slice(0,13),
      description:es?`${q}: describe aquí en 2-3 frases qué es tu producto y para quién es, con tus palabras clave al principio.\n\nCARACTERÍSTICAS\n- Material:\n- Medidas:\n- Colores o variantes:\n- Personalización:\n\nENVÍO Y PLAZOS\n- Tiempo de preparación:\n- Envío:\n\nIDEAL PARA REGALAR\n- Ocasiones:\n\n¿Dudas? Escríbeme y te respondo lo antes posible.`:`${q}: describe in 2-3 sentences what your product is and who it is for, with your keywords first.\n\nDETAILS\n- Material:\n- Size:\n- Colors or variants:\n- Personalization:\n\nSHIPPING & PROCESSING\n- Processing time:\n- Shipping:\n\nPERFECT AS A GIFT\n- Occasions:\n\nQuestions? Message me and I'll reply as soon as possible.`}};
  $("#f").onsubmit=e=>e.preventDefault();
  $$("#f [data-m]",host).forEach(b=>b.onclick=async()=>{const q=$("#q").value.trim(),ol=$("#ol").value;if(!q)return;const out=$("#out");out.innerHTML=skel();
    try{if(b.dataset.m==="ai"){try{show(await api("/api/ai",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({keyword:q,notes:$("#nt").value,out:ol})}),"ai");return}catch(er){if(er.status!==501){fail(out,er);return}}}
      show(await rules(q,ol),"rules")}catch(er){fail(out,er)}});
};

/* ---- Markdown renderer (tablas, listas, citas, codigo, checklists, enlaces) ---- */
function md(src){
  const inl=x=>{const codes=[];x=String(x).replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
    x=esc(x).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,"$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,(_,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    return x.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${esc(codes[i])}</code>`)};
  const lines=String(src).replace(/\r/g,"").split("\n"),out=[];let i=0;
  const isRow=l=>/^\s*\|.*\|?\s*$/.test(l)&&l.includes("|"),isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)&&l.includes("-");
  const cells=l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const itemRe=/^(\s*)([-*•]|\d+[.)]|□|☐)\s+(.*)$/;
  while(i<lines.length){const l=lines[i],t=l.trim();
    if(!t){i++;continue}
    if(/^```/.test(t)||t==="`"){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i].trim())&&lines[i].trim()!=="`"){buf.push(lines[i]);i++}i++;
      const code=buf.join("\n").replace(/^\n+|\n+$/g,"");out.push(`<div class="mdcode"><button type="button" class="cp" data-copy>${L("Copiar","Copy")}</button><pre>${esc(code)}</pre></div>`);continue}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){out.push("<hr>");i++;continue}
    const h=t.match(/^(#{1,6})\s+(.*)/);if(h){out.push(`<h${Math.min(5,h[1].length+2)}>${inl(h[2])}</h${Math.min(5,h[1].length+2)}>`);i++;continue}
    if(t.startsWith(">")){const buf=[];while(i<lines.length&&lines[i].trim().startsWith(">")){buf.push(lines[i].trim().replace(/^>\s?/,""));i++}out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`);continue}
    if(isRow(l)){const rows=[];while(i<lines.length){if(isRow(lines[i])){rows.push(lines[i]);i++}else if(!lines[i].trim()){let k=i;while(k<lines.length&&!lines[k].trim())k++;if(k<lines.length&&isRow(lines[k]))i=k;else break}else break}
      const hasSep=rows.length>1&&isSep(rows[1]),head=cells(rows[0]),body=rows.filter((r,k)=>k>(hasSep?1:0)&&!isSep(r)).map(cells);
      out.push(`<div class="mdtb"><table><thead><tr>${head.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${head.map((_,k)=>`<td>${inl(r[k]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue}
    const im=l.match(itemRe);
    if(im){const ord=/\d/.test(im[2]),tag=ord?"ol":"ul",items=[];
      while(i<lines.length){const m=lines[i].match(itemRe);if(m){let tx=m[3],chk="";const c=tx.match(/^\[( |x|X)\]\s*(.*)/);if(c){chk=`<span class="ck${c[1]===" "?"":" on"}" aria-hidden="true"></span>`;tx=c[2]}else if(m[2]==="□"||m[2]==="☐")chk='<span class="ck" aria-hidden="true"></span>';
          items.push(`<li${chk?' class="todo"':""} style="margin-left:${Math.min(3,Math.floor(m[1].length/2))*16}px">${chk}${inl(tx)}</li>`);i++}
        else if(!lines[i].trim()&&i+1<lines.length&&itemRe.test(lines[i+1])){i++}else break}
      out.push(`<${tag}>${items.join("")}</${tag}>`);continue}
    const c=t.match(/^\[( |x|X)\]\s+(.*)/);if(c){out.push(`<p class="todo"><span class="ck${c[1]===" "?"":" on"}"></span>${inl(c[2])}</p>`);i++;continue}
    const para=[t];i++;while(i<lines.length&&lines[i].trim()&&!/^(```|#{1,6}\s|>|\||(\s*)([-*•]|\d+[.)]|□|☐)\s|-{3,}$|`$)/.test(lines[i].trim())){para.push(lines[i].trim());i++}
    out.push(`<p>${para.map(inl).join("<br>")}</p>`)}
  return out.join("")}

  const srcHtml=m=>{const w=m.web||{};return `${m.data?`<div class="src"><b>${L("Datos reales de Etsy","Real Etsy data")}:</b> ${nf(m.data.sample)} ${L("anuncios líderes de","top listings from")} ${m.data.seeds.map(esc).join(", ")}${m.data.country?" · "+esc(cname(m.data.country)):""}</div>`:""}${m.derr?`<div class="src">${L("No se pudieron cargar los datos de Etsy:","Could not load Etsy data:")} ${esc(m.derr)}</div>`:""}${w.entry?`<iframe sandbox srcdoc="${esc(w.entry)}" title="Google Search" style="border:0;width:100%;height:56px;margin-top:8px;color-scheme:light"></iframe>`:""}${w.sources?.length?`<div class="src"><b>${L("Fuentes de internet","Web sources")}:</b> ${w.sources.filter(x=>/^https:\/\//.test(x.url)).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||x.url)}</a>`).join(" · ")}</div>`:""}${w.requested&&!w.supported?`<div class="src">${L("Sin internet: añade TAVILY_API_KEY (gratis) o GEMINI_API_KEY en el servidor.","No web access: add TAVILY_API_KEY (free) or GEMINI_API_KEY on the server.")}</div>`:""}${m.sources?.length?`<details class="src"><summary>${L("Basado en","Based on")} ${m.sources.length} ${L("documentos de tus skills","documents from your skills")}</summary>${m.sources.map(esc).join(", ")}</details>`:""}`};
  host.innerHTML=`<div class="cc ${side?"":"closed"}" id="cc">
    <aside class="cc-side" aria-label="${L("Historial de chats","Chat history")}"><div class="cc-sh"><button class="btn p sm" id="cnew">${cico("plus")}${L("Nuevo chat","New chat")}</button></div><div class="cc-list" id="clist"></div><div class="cc-sf"><button class="btn sm" id="cclear">${cico("trash")}${L("Borrar todo el historial","Clear all history")}</button></div></aside>
    <section class="cc-main"><div class="cc-top"><button class="btn sm" id="ctog" aria-label="${L("Mostrar u ocultar historial","Toggle history")}" aria-expanded="${side}">${cico("panel")}</button><div><h1 style="font-size:1.25rem">${L("Coach IA de Etsy","Etsy AI Coach")}</h1></div></div>
    <p class="cc-info">${cico("info")}<span>${CFG.ai?L("Respuestas orientativas: la IA puede equivocarse y las reglas de Etsy cambian; contrasta lo importante en la ayuda oficial. No hay datos reales de búsquedas ni ventas.","Guidance only: the AI can be wrong and Etsy rules change; verify what matters in Etsy's official help. No real search or sales data.")+(CFG.provider?` <i>(${esc(CFG.provider)})</i>`:""):L("La IA no está activada en el servidor: añade NVIDIA_API_KEY (o GEMINI_API_KEY / GROQ_API_KEY) en Render.","AI is not enabled on the server: add NVIDIA_API_KEY (or GEMINI_API_KEY / GROQ_API_KEY) in Render.")}</span></p>
    <div class="cc-chat" id="ch" aria-live="polite"></div>
    <form class="cc-comp" id="f"><textarea id="q" rows="2" placeholder="${L("Escribe tu pregunta… (Enter envía, Mayús+Enter salto de línea)","Type your question… (Enter sends, Shift+Enter new line)")}" aria-label="${L("Pregunta","Question")}" ${CFG.ai?"":"disabled"}></textarea>
      <div class="cc-opts"><input type="text" id="nc" placeholder="${L("Nicho opcional (p. ej. silver ring)","Optional niche (e.g. silver ring)")}" aria-label="${L("Nicho","Niche")}"><label class="tg"><input type="checkbox" id="ud" checked><span>${L("Datos reales de Etsy","Real Etsy data")}</span></label><label class="tg"><input type="checkbox" id="uw" checked><span>${L("Buscar en internet","Search the web")}</span></label><button class="btn p cc-send" id="sbtn" ${CFG.ai?"":"disabled"} aria-label="${L("Enviar","Send")}">${cico("send")}<span>${L("Enviar","Send")}</span></button></div></form></section></div>`;
  const ch=$("#ch"),cc=$("#cc");
  const nearBottom=()=>document.documentElement.scrollHeight-window.scrollY-window.innerHeight<160;
  const bubble=m=>m.role==="user"?`<div class="msg u">${esc(m.content)}</div>`:`<div class="msg a"><div class="md">${md(m.content)}</div>${srcHtml(m)}<div class="cc-act"><button type="button" class="btn sm" data-copymsg>${cico("copy")}${L("Copiar respuesta","Copy answer")}</button></div></div>`;
  const draw=()=>{const c=chat();
    if(!c||!c.msgs.length){ch.innerHTML=`<div class="cc-empty"><h2>${L("¿En qué te ayudo hoy?","How can I help today?")}</h2><p class="mu">${L("Uso tus skills de Etsy, los datos reales de la web y, si lo activas, internet.","I use your Etsy skills, the real data from this web and, if enabled, the internet.")}</p><div class="cc-sug">${sugg.map((s,k)=>`<button type="button" class="sg" data-k="${k}"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></button>`).join("")}</div></div>`;
      $$(".sg",ch).forEach(b=>b.onclick=()=>CFG.ai&&ask(sugg[b.dataset.k][1]))}
    else ch.innerHTML=c.msgs.map(bubble).join("");
    bindCopy()};
  const bindCopy=()=>{$$("[data-copy]",ch).forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.nextElementSibling.textContent).then(()=>toast(L("Copiado","Copied")))});
    $$("[data-copymsg]",ch).forEach((b,k)=>b.onclick=()=>{const ms=chat().msgs.filter(m=>m.role==="assistant");navigator.clipboard?.writeText(ms[k].content).then(()=>toast(L("Copiado","Copied")))})};
  const list=()=>{$("#clist").innerHTML=chats.length?chats.map(c=>`<div class="cc-it${c.id===cur?" on":""}" data-id="${c.id}"><button type="button" class="t" title="${esc(c.title)}">${esc(c.title)}</button><button type="button" class="ib" data-a="ren" aria-label="${L("Renombrar","Rename")}" title="${L("Renombrar","Rename")}">${cico("edit")}</button><button type="button" class="ib" data-a="del" aria-label="${L("Eliminar","Delete")}" title="${L("Eliminar conversación","Delete chat")}">${cico("trash")}</button></div>`).join(""):`<p class="mu" style="padding:8px 12px;font-size:.84rem">${L("Aún no hay conversaciones. Se guardan solas en este navegador.","No chats yet. They are saved automatically in this browser.")}</p>`;
    $$(".cc-it",$("#clist")).forEach(el=>{const id=el.dataset.id;
      el.querySelector(".t").onclick=()=>{if(busy)return;cur=id;save();list();draw();if(innerWidth<=900)setSide(false)};
      el.querySelector('[data-a="ren"]').onclick=()=>{const c=chats.find(x=>x.id===id),n=prompt(L("Nuevo nombre del chat","New chat name"),c.title);if(n&&n.trim()){c.title=n.trim().slice(0,60);save();list()}};
      el.querySelector('[data-a="del"]').onclick=()=>{if(busy)return;if(confirm(L("¿Eliminar esta conversación?","Delete this chat?"))){chats=chats.filter(x=>x.id!==id);if(cur===id)cur=chats[0]?.id||"";save();list();draw()}}})};
  const setSide=v=>{side=v;store.set("coach_side",v);cc.classList.toggle("closed",!v);$("#ctog").setAttribute("aria-expanded",v)};
  $("#ctog").onclick=()=>setSide(!side);
  let busy=false;
  const newChat=()=>{if(busy)return;const c=chat();if(c&&!c.msgs.length){$("#q").focus();return}cur="";draw();list();$("#q").focus()};
  $("#cnew").onclick=()=>{newChat();if(innerWidth<=900)setSide(false)};
  $("#cclear").onclick=()=>{if(busy||!chats.length)return;if(confirm(L("¿Borrar TODO el historial de conversaciones de este navegador?","Delete ALL chat history in this browser?"))){chats=[];cur="";store.set("coach",[]);save();list();draw()}};
  async function ask(q){q=q.trim();if(!q||busy||!CFG.ai)return;
    let c=chat();if(!c){c={id:uid(),title:q.slice(0,42),ts:Date.now(),msgs:[]};chats.unshift(c);cur=c.id}
    const prior=c.msgs.slice(-6).map(m=>({role:m.role,content:m.content.slice(0,1500)}));
    c.msgs.push({role:"user",content:q});c.ts=Date.now();const am={role:"assistant",content:""};c.msgs.push(am);save();list();draw();
    $("#q").value="";busy=true;const btn=$("#sbtn");btn.classList.add("stop");btn.innerHTML=cico("stop")+`<span>${L("Parar","Stop")}</span>`;btn.setAttribute("aria-label",L("Parar","Stop"));btn.disabled=false;
    const node=ch.lastElementChild;node.innerHTML=`<div class="md typing"><span class="mu">${L("Pensando…","Thinking…")}</span></div>`;window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
    const ab=COACH_AB=new AbortController();let pend=false;
    const paint=()=>{pend=false;const stick=nearBottom();const b=node.querySelector(".md");b.innerHTML=md(am.content);b.classList.add("typing");if(stick)window.scrollTo(0,document.documentElement.scrollHeight)};
    const onClick=()=>{if(busy)ab.abort()};btn.onclick=e=>{if(busy){e.preventDefault();onClick()}};
    let failed=null;
    try{
      const r=await fetch("/api/coach/stream?lang="+LANG+(CTY?"&country="+CTY:""),{method:"POST",signal:ab.signal,headers:{"content-type":"application/json"},body:JSON.stringify({niche:$("#nc").value.trim(),use_data:$("#ud").checked,use_web:$("#uw").checked,question:q,history:prior})});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"Error "+r.status)}
      const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
      const handle=blk=>{let ev="message",data="";blk.split("\n").forEach(l=>{if(l.startsWith("event:"))ev=l.slice(6).trim();else if(l.startsWith("data:"))data+=l.slice(5).trim()});if(!data)return;let j;try{j=JSON.parse(data)}catch{return}
        if(ev==="meta"){am.sources=j.sources;am.data=j.data;am.derr=j.data_error}
        else if(ev==="delta"){am.content+=j.t;if(!pend){pend=true;requestAnimationFrame(paint)}}
        else if(ev==="done"){am.web=j.web}
        else if(ev==="error"){failed=j.message}};
      for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;while((k=buf.indexOf("\n\n"))>=0){handle(buf.slice(0,k));buf=buf.slice(k+2)}}
      if(buf.trim())handle(buf)
    }catch(e){if(e.name!=="AbortError")failed=e.message}
    busy=false;COACH_AB=null;btn.classList.remove("stop");btn.innerHTML=cico("send")+`<span>${L("Enviar","Send")}</span>`;btn.setAttribute("aria-label",L("Enviar","Send"));btn.onclick=null;
    if(!am.content.trim()){c.msgs.splice(c.msgs.indexOf(am),1);if(failed){toast(failed);$("#q").value=q}}
    else if(failed)am.content+="\n\n> "+L("La respuesta se cortó: ","The answer was cut off: ")+failed;
    save();list();draw()}
  $("#f").onsubmit=e=>{e.preventDefault();if(!busy)ask($("#q").value)};
  $("#q").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)ask($("#q").value)}};
  list();draw();
};

function buildNav(cur){

   `<div class="grp ${m[2].some(s=>s[0]===cur)?"open":""}"><button class="nv" aria-expanded="${m[2].some(s=>s[0]===cur)}">${ico(m[1])}${m[0]}<span class="ch">${ico("chev")}</span></button><div class="sub">${m[2].map(s=>`<a href="#/${s[0]}" ${s[0]===cur?'aria-current="page"':""}>${s[1]}</a>`).join("")}</div></div>`:
   `<a class="nv" href="#/${m[0]}" ${m[0]===cur?'aria-current="page"':""}>${ico(m[1])}${m[2]}</a>`).join("")+`<div class="foot-side">${L("Datos públicos de la API de Etsy","Public data from the Etsy API")}</div>`;

/* ---- menú y cabecera plegables (estado recordado) ---- */
const chrome={nav:store.get("nav_hidden",false),top:store.get("top_hidden",false)};
function toggleNav(){if(innerWidth<=900){$("#side").classList.toggle("open");return}chrome.nav=!chrome.nav;store.set("nav_hidden",chrome.nav);applyChrome()}
function setTop(h){const t=$("#top");if(!t)return;chrome.top=h;store.set("top_hidden",h);applyChrome()}
function applyChrome(){const t=$("#top");document.body.classList.toggle("nav-hidden",chrome.nav);document.body.classList.toggle("top-hidden",chrome.top);
  if(t){t.style.marginTop=chrome.top?"-"+(t.offsetHeight||60)+"px":"";t.inert=chrome.top;t.setAttribute("aria-hidden",chrome.top)}
  const b=$("#burger");if(b)b.setAttribute("aria-pressed",!chrome.nav)}
function buildDock(){const d=$("#dock");if(!d)return;d.innerHTML=`<button class="btn sm" id="dk-m" aria-label="${L("Mostrar u ocultar el menú","Show or hide the menu")}" title="${L("Mostrar u ocultar el menú","Show or hide the menu")}">${ico("menu")}</button><button class="btn sm" id="dk-h" title="${L("Mostrar la cabecera","Show the header")}">${ico("chev")}<span style="margin-left:4px">${L("Cabecera","Header")}</span></button>`;
  $("#dk-m").onclick=toggleNav;$("#dk-h").onclick=()=>setTop(false);applyChrome()}
addEventListener("resize",()=>{if(chrome.top)applyChrome()});
document.addEventListener("click",e=>{const sd=$("#side");if(innerWidth<=900&&sd&&sd.classList.contains("open")&&!e.target.closest("#side,#burger,#dk-m"))sd.classList.remove("open");if(innerWidth<=900&&e.target.closest("#side a"))sd.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.altKey&&!e.ctrlKey&&!e.metaKey&&(e.key==="m"||e.key==="M")){e.preventDefault();toggleNav()}else if(e.altKey&&(e.key==="h"||e.key==="H")){e.preventDefault();setTop(!chrome.top)}});
function buildTop(){
  const cs=Object.keys(CFG.countries);
  $("#top").innerHTML=`<button class="btn sm burger" id="burger" aria-label="${L("Mostrar u ocultar el menú","Show or hide the menu")}" title="${L("Mostrar u ocultar el menú","Show or hide the menu")}">${ico("menu")}</button><button class="btn sm hdr" id="hdrx" aria-label="${L("Ocultar la cabecera","Hide the header")}" title="${L("Ocultar la cabecera","Hide the header")}">${ico("chev")}</button><form id="qf" role="search"><input type="text" id="qq" placeholder="${L("Buscar una palabra clave…","Search a keyword…")}" aria-label="${L("Buscar palabra clave","Search keyword")}"><button class="btn p" type="submit">${L("Buscar","Search")}</button></form>
   <div class="topright"><select id="cty" aria-label="${L("País del vendedor","Seller country")}" title="${L("Filtra los resultados por el país donde está el vendedor","Filters results by the country where the seller is based")}">${ctyOptions()}</select>
   <div class="usew"><button type="button" class="use" id="use" aria-haspopup="true" aria-expanded="false" title="${L("Peticiones a la API de Etsy usadas hoy","Etsy API requests used today")}"><small>${L("Búsquedas hoy","Searches today")}</small><b id="use-n">0</b><span class="ub"><i id="use-b" style="width:0"></i></span></button><div class="upop" id="use-pop" hidden></div></div><div class="seg" role="group" aria-label="Language"><button type="button" data-l="es" aria-pressed="${LANG==="es"}">ES</button><button type="button" data-l="en" aria-pressed="${LANG==="en"}">EN</button></div></div>`;
  $("#use").onclick=e=>{e.stopPropagation();const p=$("#use-pop");p.hidden=!p.hidden;$("#use").setAttribute("aria-expanded",!p.hidden);if(!p.hidden)Usage.pop()};

  $$(".seg button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;store.set("lang",LANG);document.documentElement.lang=LANG;buildTop();route()});
}
async function route(){
  const h=location.hash.replace(/^#\/?/,""),[name,qs]=h.split("?"),page=R[name]?name:"dashboard",view=$("#view");
  document.title=`ShopScope · ${L("Investigación de mercado para Etsy","Etsy market research")}`;
  buildNav(page==="catkw"?"categories":page);view.innerHTML="";window.scrollTo(0,0);
  watchFold(view);
  try{await R[page](view,new URLSearchParams(qs||""))}catch(e){fail(view,e)}
  autoFold(view);
}
addEventListener("hashchange",route);
(async()=>{document.documentElement.lang=LANG;try{CFG=await api("/api/config")}catch{}buildTop();route()})();
